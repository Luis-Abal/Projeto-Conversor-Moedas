<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Converter-Money</title>
</head>
<body>
    <img class="logo" src="./assets/logo.gif" alt="logo-conversor">
    <main>
        <label>
             Converter <b>de</b>
             <select class="currency-from">
                 <option value="real">R$ Real Brasileiro</option>
                 <option value="dolar">US$ Dólar Americano</option>
                 <option value="euro">€ Euro</option>
                 <option value="francoSuico">CHF Franco-Suíço</option>
            </select>
        </label>

         <label>
             Converter <b>para</b>
             <select class="currency-to">
                 <option value="real">R$ Real Brasileiro</option>
                 <option value="dolar">US$ Dólar Americano</option>
                 <option value="euro">€ Euro</option>
                 <option value="francoSuico">CHF Franco-Suíço</option>

            </select>
        
        </label>
        <label>
            Valor
            <input class="input-currency" placeholder="R$ 10.000,00">
        </label>
        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/real.png" alt="moeda-a-converter">
                <p class="currency" id="currency-from-name">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>

            </div>

            <img class="arrow" src="./assets/arrow.png" alt="seta">

            <div class="currency-box">
                <img class="currency-img" src="./assets/usa.png" alt="moeda-convertida">
                <p class="currency" id="currency-name">Dólar Americano</p>
                <p class="currency-value">US$ 0,0</p>
            </div>

        </section>

    </main>
    </body>
    <script src="./scripts.js"></script>
</html>
